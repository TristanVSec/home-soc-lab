# Sanitized. Single-binary Loki, filesystem storage, TSDB index.

auth_enabled: false           # single-tenant. See docs/03 on what this implies.

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

limits_config:
  ingestion_rate_mb: 16              # raised from the 4 MB default
  ingestion_burst_size_mb: 32        # raised from the 6 MB default
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # 7 days
  retention_period: 336h             # 14 days

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true            # REQUIRED — retention_period alone does nothing
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093   # vestigial — no Alertmanager runs here
