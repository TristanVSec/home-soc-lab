# Sanitized excerpt — address variables and rule/output blocks only.
# Not a complete suricata.yaml.

vars:
  address-groups:
    # Placeholder. Narrow this to the subnet you actually monitor rather than
    # leaving all three RFC1918 ranges enabled — see docs/04 on HOME_NET scope.
    HOME_NET: "[192.0.2.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"

    # ICS/SCADA variables ship enabled by default. Left at defaults here;
    # the matching rule categories are not loaded on this network.
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"

  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502

af-packet:
  # The interface name must match the capture NIC. The stock systemd unit
  # passes no -i flag, so THIS is where the interface comes from — a stale
  # name here means the sensor reads the wrong link or nothing at all.
  - interface: eth1
    threads: 2                # physical cores, not "auto"
    use-mmap: yes
    tpacket-v3: yes
    ring-size: 32768          # raised from default; see docs/04 on drops
    block-size: 1048576
    checksum-checks: no       # mirrored frames may have uncomputed checksums
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
  - interface: default

